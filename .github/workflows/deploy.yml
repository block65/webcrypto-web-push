name: Deploy

on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          node-version-file: '.node-version'

      - run: make

      # the trusted publisher grants "npm stage publish", so this uploads for
      # review rather than going live. approve it with pnpm stage approve.
      # provenance is attached automatically when publishing over oidc
      - run: pnpm stage publish -r --filter @block65/webcrypto-web-push --access public --no-git-checks
