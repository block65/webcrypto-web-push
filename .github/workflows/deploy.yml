name: Deploy

on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          node-version-file: '.node-version'

      - run: make

      - run: pnpm publish -r --filter @block65/webcrypto-web-push --access=public --no-git-checks --provenance
